name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alttez_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alttez_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate migration chain
        run: python scripts/apply_supabase_migrations.py

      - name: Apply migrations to PostgreSQL
        run: python scripts/apply_supabase_migrations.py --apply --database-url 'postgresql://postgres:postgres@localhost:5432/alttez_ci?sslmode=disable'

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff==0.17.5

      - name: Run ruff
        run: ruff check .

