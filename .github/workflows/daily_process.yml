name: ALTTEZ Daily Process

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alttez-daily-process
  cancel-in-progress: false

jobs:
  daily-process:
    if: github.repository == 'julianhr-ops/alttez-predictive'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ALTTEZ_DATA_SOURCE: auto
      ALTTEZ_SUPABASE_VIEW: public.international_results_compat
      ALTTEZ_ALLOW_LOCAL_FALLBACK: "true"
      ALTTEZ_USE_SYSTEM_PROXY: "false"
      ALTTEZ_PROVIDER_STACK: espn,football_data_org,statsbomb_open,local_json
      ALTTEZ_LIVE_PROVIDER_STACK: espn,football_data_org,local_json
      ALTTEZ_ESPN_ENABLED: "true"
      ALTTEZ_ESPN_LEAGUES: fifa.world,fifa.friendly
      ALTTEZ_ESPN_BASE_URL: https://site.api.espn.com/apis/site/v2/sports/soccer
      ALTTEZ_API_FOOTBALL_BASE_URL: https://v3.football.api-sports.io
      ALTTEZ_FOOTBALL_DATA_BASE_URL: https://api.football-data.org/v4
      ALTTEZ_FOOTBALL_DATA_LIVE_COMPETITIONS: WC,EC
      ALTTEZ_STATSBOMB_OPEN_ROOT: ""
      ALTTEZ_LOCAL_JSON_PATH: artifacts/provider-fallback.json
      ALTTEZ_ALERT_WEBHOOK_TIMEOUT_SECONDS: "8"
      ALTTEZ_DAILY_BRIEF_WEBHOOK_TIMEOUT_SECONDS: "10"
      ALTTEZ_DAILY_BRIEF_DELIVERY_TIMEOUT_SECONDS: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Materialize runtime .env
        shell: pwsh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALTTEZ_API_FOOTBALL_KEY: ${{ secrets.ALTTEZ_API_FOOTBALL_KEY }}
          ALTTEZ_FOOTBALL_DATA_KEY: ${{ secrets.ALTTEZ_FOOTBALL_DATA_KEY }}
          ALTTEZ_ALERT_WEBHOOK_URL: ${{ secrets.ALTTEZ_ALERT_WEBHOOK_URL }}
          ALTTEZ_ALERTS_TELEGRAM_ENABLED: ${{ secrets.ALTTEZ_ALERTS_TELEGRAM_ENABLED || 'false' }}
          ALTTEZ_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.ALTTEZ_ALERTS_TELEGRAM_BOT_TOKEN }}
          ALTTEZ_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.ALTTEZ_ALERTS_TELEGRAM_CHAT_ID }}
          ALTTEZ_DAILY_BRIEF_DELIVERY_CHANNEL: ${{ (secrets.ALTTEZ_DAILY_BRIEF_TELEGRAM_BOT_TOKEN != '' && secrets.ALTTEZ_DAILY_BRIEF_TELEGRAM_CHAT_ID != '') && 'telegram' || (secrets.ALTTEZ_DAILY_BRIEF_WEBHOOK_URL != '' && 'webhook' || 'auto') }}
          ALTTEZ_DAILY_BRIEF_WEBHOOK_URL: ${{ secrets.ALTTEZ_DAILY_BRIEF_WEBHOOK_URL }}
          ALTTEZ_DAILY_BRIEF_TELEGRAM_BOT_TOKEN: ${{ secrets.ALTTEZ_DAILY_BRIEF_TELEGRAM_BOT_TOKEN }}
          ALTTEZ_DAILY_BRIEF_TELEGRAM_CHAT_ID: ${{ secrets.ALTTEZ_DAILY_BRIEF_TELEGRAM_CHAT_ID }}
          ALTTEZ_DAILY_BRIEF_DELIVER: ${{ ((secrets.ALTTEZ_DAILY_BRIEF_TELEGRAM_BOT_TOKEN != '' && secrets.ALTTEZ_DAILY_BRIEF_TELEGRAM_CHAT_ID != '') || secrets.ALTTEZ_DAILY_BRIEF_WEBHOOK_URL != '') && 'true' || 'false' }}
          ALTTEZ_AUTO_PROMOTE_MODELS: ${{ secrets.ALTTEZ_AUTO_PROMOTE_MODELS || 'false' }}
          ALTTEZ_SUPPORTED_PRODUCTION_MODEL_FAMILIES: ${{ secrets.ALTTEZ_SUPPORTED_PRODUCTION_MODEL_FAMILIES || 'poisson,xgboost' }}
        run: |
          if ($env:SUPABASE_DB_URL) {
            $dbUri = [System.Uri]$env:SUPABASE_DB_URL
            $dbUser = [System.Uri]::UnescapeDataString(($dbUri.UserInfo -split ':', 2)[0])
            $projectRef = if ($dbUser -match '^postgres\.(.+)$') { $Matches[1] } elseif ($dbUri.Host -match '^db\.([^.]+)\.supabase\.co$') { $Matches[1] }
            foreach ($value in @($dbUri.Host, $dbUser, $projectRef)) {
              if ($value) { Write-Output "::add-mask::$value" }
            }
          }
          @"
          SUPABASE_DB_URL=$env:SUPABASE_DB_URL
          ALTTEZ_DATA_SOURCE=$env:ALTTEZ_DATA_SOURCE
          ALTTEZ_SUPABASE_VIEW=$env:ALTTEZ_SUPABASE_VIEW
          ALTTEZ_ALLOW_LOCAL_FALLBACK=$env:ALTTEZ_ALLOW_LOCAL_FALLBACK
          ALTTEZ_USE_SYSTEM_PROXY=$env:ALTTEZ_USE_SYSTEM_PROXY
          ALTTEZ_PROVIDER_STACK=$env:ALTTEZ_PROVIDER_STACK
          ALTTEZ_LIVE_PROVIDER_STACK=$env:ALTTEZ_LIVE_PROVIDER_STACK
          ALTTEZ_ESPN_ENABLED=$env:ALTTEZ_ESPN_ENABLED
          ALTTEZ_ESPN_LEAGUES=$env:ALTTEZ_ESPN_LEAGUES
          ALTTEZ_ESPN_BASE_URL=$env:ALTTEZ_ESPN_BASE_URL
          ALTTEZ_API_FOOTBALL_KEY=$env:ALTTEZ_API_FOOTBALL_KEY
          ALTTEZ_API_FOOTBALL_BASE_URL=$env:ALTTEZ_API_FOOTBALL_BASE_URL
          ALTTEZ_FOOTBALL_DATA_KEY=$env:ALTTEZ_FOOTBALL_DATA_KEY
          ALTTEZ_FOOTBALL_DATA_BASE_URL=$env:ALTTEZ_FOOTBALL_DATA_BASE_URL
          ALTTEZ_FOOTBALL_DATA_LIVE_COMPETITIONS=$env:ALTTEZ_FOOTBALL_DATA_LIVE_COMPETITIONS
          ALTTEZ_STATSBOMB_OPEN_ROOT=$env:ALTTEZ_STATSBOMB_OPEN_ROOT
          ALTTEZ_LOCAL_JSON_PATH=$env:ALTTEZ_LOCAL_JSON_PATH
          ALTTEZ_ALERT_WEBHOOK_URL=$env:ALTTEZ_ALERT_WEBHOOK_URL
          ALTTEZ_ALERT_WEBHOOK_TIMEOUT_SECONDS=$env:ALTTEZ_ALERT_WEBHOOK_TIMEOUT_SECONDS
          ALTTEZ_ALERTS_TELEGRAM_ENABLED=$env:ALTTEZ_ALERTS_TELEGRAM_ENABLED
          ALTTEZ_ALERTS_TELEGRAM_BOT_TOKEN=$env:ALTTEZ_ALERTS_TELEGRAM_BOT_TOKEN
          ALTTEZ_ALERTS_TELEGRAM_CHAT_ID=$env:ALTTEZ_ALERTS_TELEGRAM_CHAT_ID
          ALTTEZ_DAILY_BRIEF_DELIVERY_CHANNEL=$env:ALTTEZ_DAILY_BRIEF_DELIVERY_CHANNEL
          ALTTEZ_DAILY_BRIEF_WEBHOOK_URL=$env:ALTTEZ_DAILY_BRIEF_WEBHOOK_URL
          ALTTEZ_DAILY_BRIEF_WEBHOOK_TIMEOUT_SECONDS=$env:ALTTEZ_DAILY_BRIEF_WEBHOOK_TIMEOUT_SECONDS
          ALTTEZ_DAILY_BRIEF_TELEGRAM_BOT_TOKEN=$env:ALTTEZ_DAILY_BRIEF_TELEGRAM_BOT_TOKEN
          ALTTEZ_DAILY_BRIEF_TELEGRAM_CHAT_ID=$env:ALTTEZ_DAILY_BRIEF_TELEGRAM_CHAT_ID
          ALTTEZ_DAILY_BRIEF_DELIVERY_TIMEOUT_SECONDS=$env:ALTTEZ_DAILY_BRIEF_DELIVERY_TIMEOUT_SECONDS
          ALTTEZ_DAILY_BRIEF_DELIVER=$env:ALTTEZ_DAILY_BRIEF_DELIVER
          ALTTEZ_AUTO_PROMOTE_MODELS=$env:ALTTEZ_AUTO_PROMOTE_MODELS
          ALTTEZ_SUPPORTED_PRODUCTION_MODEL_FAMILIES=$env:ALTTEZ_SUPPORTED_PRODUCTION_MODEL_FAMILIES
          "@ | Set-Content -Path .env -Encoding utf8

      - name: Run daily process
        shell: pwsh
        run: |
          ./scripts/run_daily_process.ps1 -ApplyMigrations -WriteSmoke -Date ([DateTime]::UtcNow.ToString("yyyy-MM-dd"))

      # Reports can contain provider or database-derived details and are not uploaded.
